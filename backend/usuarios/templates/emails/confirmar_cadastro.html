{% extends 'emails/_base.html' %}
{% block conteudo %}
  <div style="font-size:40px; margin-bottom:16px;">🎉</div>
  <h1 style="font-size:20px; color:#FFFFFF; margin:0 0 12px; font-family: Arial, Helvetica, sans-serif;">Falta pouco, {{ nome }}!</h1>
  <p style="font-size:15px; color:#9090B0; line-height:1.6; margin:0 0 28px; font-family: Arial, Helvetica, sans-serif;">
    Confirme seu e-mail pra ativar sua conta e começar a estudar no Bancou.
  </p>
  <a href="{{ link }}" style="display:inline-block; background-color:#6C63FF; color:#FFFFFF; font-weight:700; font-size:16px; text-decoration:none; padding:14px 32px; border-radius:14px; font-family: Arial, Helvetica, sans-serif;">
    Confirmar e-mail
  </a>
  <p style="font-size:12px; color:#9090B0; line-height:1.6; margin:28px 0 0; font-family: Arial, Helvetica, sans-serif;">
    Se você não criou uma conta no Bancou, pode ignorar este e-mail.
  </p>
{% endblock %}
