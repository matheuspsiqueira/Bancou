<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bancou</title>
</head>
<body style="margin:0; padding:0; background-color:#1a1a2e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1a1a2e;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#252540; border-radius:20px;">
          <tr>
            <td style="padding:40px 32px; text-align:center; font-family: Arial, Helvetica, sans-serif;">

              <div style="font-weight:900; font-size:28px; color:#FFFFFF; margin:0 0 24px;">
                Bancou<span style="color:#FF6B35;">.</span>
              </div>

              {% block conteudo %}{% endblock %}

            </td>
          </tr>
        </table>
        <p style="font-family: Arial, Helvetica, sans-serif; font-size:12px; color:#9090B0; margin-top:24px; text-align:center;">
          Bancou — sua aprovação começa aqui.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
